services:
  reservas-db:
    image: mysql:8.4
    container_name: reservas-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-reservasdb}
      MYSQL_USER: ${MYSQL_USER:-reservas_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-reservas_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-reservas_root_pass}
    volumes:
      - reservas-db-data:/var/lib/mysql
    networks:
      - reservas-net
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 40s

  reservas-api:
    build:
      context: ./backend
      args:
        APP_VERSION: v1
    container_name: reservas-api
    environment:
      DB_HOST: ${DB_HOST:-reservas-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-reservasdb}
      DB_USER: ${DB_USER:-reservas_user}
      DB_PASSWORD: ${DB_PASSWORD:-reservas_pass}
      PORT: ${PORT:-3000}
      SEED_DEMO: ${SEED_DEMO:-true}
    networks:
      - reservas-net
    depends_on:
      reservas-db:
        condition: service_healthy
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  reservas-frontend:
    build:
      context: ./frontend
    container_name: reservas-frontend
    ports:
      - "3000:8080"
    environment:
      API_HOST: ${API_HOST:-reservas-api}
      API_PORT: ${API_PORT:-3000}
      NGINX_ENVSUBST_FILTER: ${NGINX_ENVSUBST_FILTER:-^API_}
    networks:
      - reservas-net
    depends_on:
      reservas-api:
        condition: service_healthy
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  reservas-net:
    name: reservas-net

volumes:
  reservas-db-data:
    name: reservas-db-data
